<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AskZakir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260709-1938">
</head>
<body class="landing-mode">
  <video id="video-intro" muted playsinline preload="none" poster="video/posters/intro-poster.jpg">
    <source src="video/intro.mp4" type="video/mp4">
  </video>
  <video id="video-loop" muted playsinline loop preload="none" poster="video/posters/intro-poster.jpg">
    <source src="video/loop.mp4" type="video/mp4">
  </video>

  <div class="blur-overlay" id="blur-overlay"></div>

  <section class="landing-screen" id="landing-screen">
    <div class="landing-brand">AskZakir</div>
    <div class="landing-question landing-question-right" id="landing-question">
      <p class="landing-question-text" id="landing-question-text"></p>
      <button class="landing-question-action" id="landing-question-action" type="button">Узнать ответ</button>
    </div>
  </section>

  <div class="ui-container" id="ui-container">
    <button class="drawer-toggle" id="drawer-toggle" aria-label="История чатов" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-menu"/></svg>
    </button>
    <div class="chat-area" id="chat-area"></div>
    <div class="pending-pill" id="pending-pill" hidden>
      <span class="pending-text">У вас остался незаданный вопрос</span>
      <button type="button" class="pending-send" id="pending-send">Отправить</button>
      <button type="button" class="pending-dismiss" id="pending-dismiss" aria-label="Отклонить">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg>
      </button>
    </div>
    <div class="billing-bar" id="billing-bar" hidden>
      <button class="billing-status" id="billing-status" type="button">
        <span id="billing-status-text">Ният · осталось 1/1</span>
      </button>
      <button class="billing-open" id="billing-open" type="button">Тарифы</button>
    </div>
    <div class="input-wrapper">
      <textarea rows="1" placeholder="Задайте вопрос..." autocomplete="off" spellcheck="false"></textarea>
      <div class="input-hint">⌘ + Enter</div>
      <button class="input-send" id="input-send" type="button" aria-label="Отправить вопрос">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-send"/></svg>
      </button>
    </div>
  </div>

  <!-- Drawer (chat history) -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="История чатов">
    <svg class="ornament tl"><use href="#ornament-corner"/></svg>
    <svg class="ornament tr"><use href="#ornament-corner"/></svg>
    <header class="drawer-header">
      <div class="drawer-brand">AskZakir</div>
    </header>
    <button class="drawer-new" id="btn-new-chat" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-plus"/></svg>
      <span>Новый чат</span>
    </button>
    <div class="drawer-list-wrap">
      <ul class="drawer-list" id="drawer-list"></ul>
      <div class="drawer-empty" id="drawer-empty">История пуста</div>
    </div>
    <footer class="drawer-footer" id="drawer-footer">
      <div class="drawer-user-login" id="drawer-user-login"></div>
      <button type="button" class="drawer-plan" id="drawer-plan" hidden>
        <span id="drawer-plan-text">Ният · осталось 1/1</span>
        <span>Тарифы</span>
      </button>
      <button type="button" class="drawer-logout" id="drawer-logout">Выйти</button>
    </footer>
  </aside>

  <!-- Auth modal -->
  <div class="auth-backdrop" id="auth-backdrop"></div>
  <div class="auth-modal" id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <svg class="ornament tl"><use href="#ornament-corner"/></svg>
    <svg class="ornament tr"><use href="#ornament-corner"/></svg>
    <svg class="ornament bl"><use href="#ornament-corner"/></svg>
    <svg class="ornament br"><use href="#ornament-corner"/></svg>

    <button type="button" class="auth-close" id="auth-close" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg>
    </button>

    <div class="auth-greeting" id="auth-greeting" hidden></div>
    <h2 class="auth-title" id="auth-title">Вход через Google</h2>

    <form class="auth-form" id="auth-form" novalidate>
      <div class="auth-provider-list auth-provider-list--single">
        <a href="/api/auth/google" class="auth-google-btn" id="auth-google-btn" role="button">
          <span class="auth-provider-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9Z"/>
              <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4c-7.7 0-14.3 4.3-17.7 10.7Z"/>
              <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44Z"/>
              <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9Z"/>
            </svg>
          </span>
          <span class="auth-google-text">Продолжить с Google</span>
        </a>
      </div>
      <div class="auth-error" id="auth-error" aria-live="polite"></div>
    </form>
  </div>

  <!-- Pricing modal -->
  <div class="pricing-backdrop" id="pricing-backdrop"></div>
  <div class="pricing-modal" id="pricing-modal" role="dialog" aria-modal="true" aria-labelledby="pricing-title">
    <button type="button" class="pricing-close" id="pricing-close" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg>
    </button>

    <div class="pricing-head">
      <h2 class="pricing-title" id="pricing-title">Тарифы AskZakir</h2>
      <p class="pricing-caption" id="pricing-caption">Выберите лимит вопросов на месяц.</p>
    </div>

    <div class="pricing-toggle" role="tablist" aria-label="Период оплаты">
      <button type="button" data-billing-cycle="monthly">Месяц</button>
      <button type="button" class="active" data-billing-cycle="annual">Год</button>
    </div>

    <div class="pricing-grid" id="pricing-grid"></div>

    <form class="pricing-request" id="pricing-request-form" hidden>
      <div class="pricing-request-title" id="pricing-request-title">Заявка на тариф</div>
      <label class="pricing-request-label" for="pricing-contact">Telegram или email</label>
      <div class="pricing-request-row">
        <input id="pricing-contact" type="text" autocomplete="email" placeholder="@username или email">
        <button type="submit">Отправить</button>
      </div>
      <div class="pricing-request-status" id="pricing-request-status" aria-live="polite"></div>
    </form>
  </div>

  <!-- Reusable ornament corner (referenced by <use>) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="ornament-corner" viewBox="0 0 32 32">
        <path d="M3 16 Q3 3, 16 3" stroke="currentColor" stroke-width="0.9" fill="none" stroke-linecap="round"/>
        <path d="M8 16 Q8 8, 16 8" stroke="currentColor" stroke-width="0.7" fill="none" opacity="0.55" stroke-linecap="round"/>
        <circle cx="16" cy="3" r="1.3" fill="currentColor"/>
        <circle cx="3" cy="16" r="1.3" fill="currentColor"/>
        <path d="M16 3 L16 6 M3 16 L6 16" stroke="currentColor" stroke-width="0.6" opacity="0.7"/>
      </symbol>
      <symbol id="ornament-star" viewBox="0 0 24 24">
        <path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="none" stroke="currentColor" stroke-width="0.8"/>
        <path d="M12 6 L13 11 L18 12 L13 13 L12 18 L11 13 L6 12 L11 11 Z" fill="currentColor" opacity="0.5"/>
      </symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24">
        <line x1="5" y1="8"  x2="19" y2="8"  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="5" y1="16" x2="19" y2="16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="1.1" fill="currentColor"/>
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <line x1="12" y1="6" x2="12" y2="18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="6"  y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="0.9" fill="currentColor"/>
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <line x1="7" y1="7" x2="17" y2="17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="17" y1="7" x2="7" y2="17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </symbol>
      <symbol id="icon-send" viewBox="0 0 24 24">
        <path d="M4.5 19.5 20 12 4.5 4.5 6.4 11H13v2H6.4l-1.9 6.5Z" fill="currentColor"/>
      </symbol>
    </defs>
  </svg>

  <!-- Dev Panel -->
  <div id="dev-panel">
    <div class="dev-title">Dev Panel</div>
    <label>Ширина поля <span id="v-input-w">500</span>px
      <input type="range" id="r-input-w" min="200" max="900" value="500">
    </label>
    <label>Ширина размытия <span id="v-blur-w">50</span>%
      <input type="range" id="r-blur-w" min="20" max="100" value="50">
    </label>
    <label>Сила размытия <span id="v-blur-s">16</span>px
      <input type="range" id="r-blur-s" min="0" max="40" value="16">
    </label>
    <label>Граница размытия <span id="v-blur-edge">40</span>%
      <input type="range" id="r-blur-edge" min="0" max="90" value="40">
    </label>
    <label>Затемнение <span id="v-dark">0.25</span>
      <input type="range" id="r-dark" min="0" max="60" value="25">
    </label>
    <button type="button" id="btn-skip-thinking" class="dev-btn" disabled>Пропустить thinking</button>
  </div>

  <script type="module" src="src/main.js?v=20260709-1938"></script>
</body>
</html>
